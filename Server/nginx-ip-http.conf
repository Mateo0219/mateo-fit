# HTTP is used only for ACME certificate validation. Meal requests require HTTPS.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/mateo-fit-acme;
        default_type text/plain;
    }
    location / { return 404; }
}
