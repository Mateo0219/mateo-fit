name: XuXu
options:
  bundleIdPrefix: com.personal.xuxu
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 'W4Z6G93VSH'
    CODE_SIGN_STYLE: Automatic
packages:
  FitnessCore:
    path: .
targets:
  XuXu:
    type: application
    platform: iOS
    sources:
      - Sources/FitnessApp
    dependencies:
      - package: FitnessCore
        product: FitnessCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.xuxu.app
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/XuXu.entitlements
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.11.1'
        CURRENT_PROJECT_VERSION: '22'
    scheme:
      gatherCoverageData: false
